# Builds and publishes the server/ Docker image to the GitHub Container Registry, pinned to the
# fhirpath-rb version that was just released. Triggered by the "Release" workflow (release.yml)
# completing successfully, rather than independently on `release: published`, so this always
# runs after the gem has actually landed on rubygems.org - not just after the GitHub release was
# created - since the Docker build needs to `gem install` that exact version.
name: Publish server image

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the released fhirpath-rb version
        id: version
        run: |
          version=$(ruby -r./lib/fhirpath/version -e 'puts Fhirpath::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # release.yml's "Release to rubygems.org" step completing doesn't mean the version is
      # resolvable yet - rubygems.org's compact index (what `gem install`/`bundle install` both
      # read) lags the push by anywhere from a few seconds to a couple of minutes. Without this,
      # the Docker build's `bundle install` intermittently fails with "could not find gem
      # fhirpath-rb". `--explain` resolves without installing, exercising the same lookup path
      # bundler uses in the Dockerfile.
      - name: Wait for the gem to be resolvable on rubygems.org
        run: |
          version="${{ steps.version.outputs.version }}"
          echo "Waiting for fhirpath-rb $version to be resolvable on rubygems.org..."
          for i in $(seq 1 30); do
            if gem install fhirpath-rb -v "$version" --explain > /dev/null 2>&1; then
              echo "fhirpath-rb $version is resolvable."
              exit 0
            fi
            echo "Not yet available (attempt $i/30); retrying in 20s..."
            sleep 20
          done
          echo "::error::Timed out waiting for fhirpath-rb $version to appear on rubygems.org"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FHIRPATH_RB_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fhirpath-rb-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fhirpath-rb-server:latest
