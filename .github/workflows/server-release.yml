# Builds and publishes the server/ Docker image to the GitHub Container Registry, pinned to the
# fhirpath-rb version that was just released. Triggered by the "Release" workflow (release.yml)
# completing successfully, rather than independently on `release: published`, so this always
# runs after the gem has actually landed on rubygems.org - not just after the GitHub release was
# created - since the Docker build needs to `gem install` that exact version.
name: Publish server image

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the released fhirpath-rb version
        id: version
        run: |
          version=$(ruby -r./lib/fhirpath/version -e 'puts Fhirpath::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FHIRPATH_RB_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fhirpath-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fhirpath-server:latest
