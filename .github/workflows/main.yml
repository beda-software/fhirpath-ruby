name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3.6'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install JRE (needed to generate the ANTLR4 parser)
        run: sudo apt-get update && sudo apt-get install -y default-jre
      - name: Build the native FHIRPath parser extension
        run: bundle exec rake parser:setup compile
      - name: Run the default task
        run: bundle exec rake
