name: Server

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: server
      - name: Run RSpec
        run: bundle exec rspec
      - name: Run RuboCop
        # --ignore-parent-exclusion: server/ has its own Gemfile and .rubocop.yml and is linted
        # as an independent project. Without this flag, RuboCop walks up to the root
        # .rubocop.yml (found via its Gemfile) and inherits its `Exclude: server/**/*`, which
        # excludes every file under server/ from this very lint run - silently making it a
        # vacuous pass (0 files inspected) instead of actually linting anything.
        run: bundle exec rubocop --ignore-parent-exclusion
